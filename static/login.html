<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >
    <title>Манул Чат — вход</title>
    <link rel="icon" type="image/png" href="/static/image/logo_min.png?v=20260809-prod1">
    <link rel="stylesheet" href="/static/style.css?v=20260809-prod1">

    <link rel="manifest" href="/manifest.webmanifest?v=20260809-pwa1">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Манул Чат">
    <link rel="apple-touch-icon" href="/static/image/apple-touch-icon.png?v=20260809-pwa1">

</head>
<body>
    <div class="login-box">
                <img
            src="/static/image/logo_max.png?v=20260809-prod1"
            alt="Манул Чат"
            class="login-logo"
        >


        <input
            id="username"
            placeholder="Логин"
            autocomplete="username"
        >

        <input
            id="password"
            type="password"
            placeholder="Пароль"
            autocomplete="current-password"
        >

        <button onclick="login()">
            Войти
        </button>

        <div
            id="error"
            class="error"
        ></div>
    </div>

    <script>
        async function login() {
            const username =
                document.getElementById("username").value;

            const password =
                document.getElementById("password").value;

            const response =
                await fetch("/api/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        username,
                        password
                    })
                });

            const data = await response.json();

            if (!response.ok) {
                document.getElementById("error")
                    .textContent =
                        data.detail || "Ошибка входа";
                return;
            }

            location.href =
                data.is_admin
                    ? "/admin"
                    : "/chat";
        }

        document
            .getElementById("password")
            .addEventListener(
                "keydown",
                event => {
                    if (event.key === "Enter") {
                        login();
                    }
                }
            );
    </script>

<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker
            .register("/service-worker.js?v=20260809-pwa1")
            .catch(error => {
                console.error("Service Worker registration failed:", error);
            });
    });
}
</script>

</body>
</html>
