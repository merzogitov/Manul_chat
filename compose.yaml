services:
  manul-chat:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: manul-chat

    restart: unless-stopped

    environment:
      APP_ENV: production
      TZ: Europe/Moscow

    ports:
      - "127.0.0.1:18080:8000"

    volumes:
      - ./data:/app/data

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/login', timeout=5).read()"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
